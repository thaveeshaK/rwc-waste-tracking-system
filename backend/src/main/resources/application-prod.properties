# Explicit environment-only database configuration; no local fallback in prod.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=0
server.port=${PORT:8080}
server.address=0.0.0.0
server.forward-headers-strategy=native
server.servlet.session.cookie.secure=true
# Cloud Run terminates HTTPS. The operational Clock remains Australia/Hobart.
# Flyway and Hibernate validation inherit the normal datasource and migration settings.
