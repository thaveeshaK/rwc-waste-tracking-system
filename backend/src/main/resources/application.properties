spring.application.name=waste-tracking-api

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/rwc_waste_tracking}
spring.datasource.username=${DB_USERNAME:rwc_app}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

server.port=8080

# Optional first-run provisioning. Existing accounts are never reset at startup.
app.bootstrap.staff-username=${INITIAL_STAFF_USERNAME:}
app.bootstrap.staff-password=${INITIAL_STAFF_PASSWORD:}
app.bootstrap.admin-username=${INITIAL_ADMIN_USERNAME:}
app.bootstrap.admin-password=${INITIAL_ADMIN_PASSWORD:}

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
